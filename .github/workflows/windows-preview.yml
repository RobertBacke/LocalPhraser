name: Windows development preview
on:
  workflow_dispatch:
    inputs:
      upload_preview:
        description: 'Upload preview artifact (only after bundled license/source review)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -r requirements-polish.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest
      - run: python -m ruff check src tests scripts packaging
      - run: python -m ruff format --check src tests scripts packaging
      - run: python -m mypy src
      - run: python -m PyInstaller --noconfirm packaging/localphraser.spec
      - name: Inventory bundled notices and native libraries offline
        run: python scripts/bundle_inventory.py --probe-ffmpeg
      - name: Smoke-check the owned preview process
        shell: pwsh
        run: |
          $previewConfig = Join-Path $env:RUNNER_TEMP 'localphraser-preview/config.json'
          New-Item -ItemType Directory -Force -Path (Split-Path $previewConfig) | Out-Null
          '{"hotkey":"Ctrl+Shift+F10","keep_microphone_ready":false}' | Set-Content $previewConfig
          $previewProcess = Start-Process -FilePath dist/LocalPhraser/LocalPhraser.exe -ArgumentList @('--smoke-test', '--config', $previewConfig) -WindowStyle Hidden -PassThru
          if (-not $previewProcess.WaitForExit(30000)) {
            Stop-Process -Id $previewProcess.Id
            throw 'Preview startup timed out'
          }
          $previewProcess.Refresh()
          if ($previewProcess.ExitCode -ne 0) { throw 'Preview startup failed' }
      - name: Verify frozen diagnostic failure reporting without models or downloads
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'runtime-missing-models.json'
          $missingRoot = Join-Path $env:RUNNER_TEMP 'runtime-models-not-installed'
          $diagnostic = Start-Process -FilePath dist/LocalPhraser/LocalPhraser.exe -ArgumentList @('check-runtime', '--root', $missingRoot, '--report', $reportPath) -WindowStyle Hidden -PassThru
          if (-not $diagnostic.WaitForExit(30000)) {
            Stop-Process -Id $diagnostic.Id
            throw 'Diagnostic failure report timed out'
          }
          $diagnostic.Refresh()
          $report = Get-Content -Raw $reportPath | ConvertFrom-Json
          if ($diagnostic.ExitCode -ne 1 -or $report.stage -ne 'model_verification' -or $report.status -ne 'failed') { throw 'Unexpected diagnostic result' }
          if (Test-Path $missingRoot) { throw 'Diagnostics created a model directory' }
      - run: python scripts/package_windows.py --output dist/packages/LocalPhraser-windows-x64-preview.zip
      - name: Compile the per-user unsigned installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          & $compiler packaging/localphraser.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $setup = Get-Item dist/packages/*-setup-preview.exe
          $digest = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($setup.Name)" | Set-Content -Encoding utf8 "$($setup.FullName).sha256"
      - name: Check installation and removal on the disposable runner
        run: python scripts/check_windows_installer.py dist/packages/LocalPhraser-0.1.0a1-windows-x64-setup-preview.exe
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.upload_preview }}
        with:
          name: LocalPhraser-windows-x64-preview
          path: dist/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
