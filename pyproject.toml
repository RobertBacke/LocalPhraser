[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "localphraser"
version = "0.1.0a1"
description = "Private, offline push-to-talk dictation for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{name = "Robert Backe"}]
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "numpy>=2.1,<3",
  "sounddevice>=0.5,<0.6",
  "faster-whisper>=1.1,<2",
  "huggingface-hub>=0.34,<1",
  "uiautomation>=2.0.20,<3; sys_platform == 'win32'",
]

[project.optional-dependencies]
polish = ["llama-cpp-python>=0.3.36,<0.4"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2", "pyinstaller>=6.12,<7", "psutil>=6,<8"]

[project.scripts]
localphraser = "localphraser.main:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
